<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        <p>Enter text or URL to generate QR Code</p>
        
        <form method="POST">
            <input type="text" name="data" placeholder="Enter URL or Text" required>
            <button type="submit">Generate QR Code</button>
        </form>

        {% if qr_image %}
        <div class="qr-result">
            <h2>Your QR Code:</h2>
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code">
            <br>
            <a href="#" onclick="downloadQR()" class="download-btn">⬇ Download QR Code</a>
        </div>

        <script>
        function downloadQR() {
            const link = document.createElement('a');
            link.href = "data:image/png;base64,{{ qr_image }}";
            link.download = "qr_code.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        </script>
        {% endif %}

        <p class="credit">Made by <span>Krishna Karthik</span></p>
    </div>
</body>
</html>
