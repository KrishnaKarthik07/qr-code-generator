<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        <p class="subtitle">Create a QR code using Python</p>

        <form method="POST">
            <input type="text" name="data" placeholder="Enter URL or text" required>
            <button type="submit">Generate QR</button>
        </form>

        {% if qr_image %}
        <div class="qr-result">
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code">
            <br>
            <a href="data:image/png;base64,{{ qr_image }}" download="qr_code.png" class="download-btn">⬇ Download QR Code</a>
             <p class="credit">made by <span>KK</span> </p>
        </div>
        {% endif %}
    </div>
   
</body>
</html>
